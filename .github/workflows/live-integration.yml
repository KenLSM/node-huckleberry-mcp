# Manually-triggered live integration suite (T3.2).
#
# Runs the credential-gated tests against the REAL account using the repo secrets.
# Read-only by default (schema read-back). Tick "allow_writes" when dispatching to
# ALSO run the log_*→read-back→delete write round-trip, which mutates the account
# (creating then deleting a real entry per tracker) — use a TEST account for the
# secrets in that case.
#
# Required repository secrets: HUCKLEBERRY_EMAIL, HUCKLEBERRY_PASSWORD
# Optional: HUCKLEBERRY_TIMEZONE (defaults to UTC).
#
# Trigger from the Actions tab → "Live Integration" → Run workflow. The "Run
# workflow" button only appears once this file is on the default branch.
name: Live Integration

on:
  workflow_dispatch:
    inputs:
      allow_writes:
        description: "Also run the log_*→delete write round-trip (mutates the account — use a test account)"
        type: boolean
        default: false

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run live integration tests
        env:
          HUCKLEBERRY_EMAIL: ${{ secrets.HUCKLEBERRY_EMAIL }}
          HUCKLEBERRY_PASSWORD: ${{ secrets.HUCKLEBERRY_PASSWORD }}
          HUCKLEBERRY_TIMEZONE: ${{ secrets.HUCKLEBERRY_TIMEZONE }}
          # Opt the write round-trip in only when the dispatcher ticks the box.
          HUCKLEBERRY_ALLOW_WRITES: ${{ inputs.allow_writes && '1' || '0' }}
        run: npm run test:integration
