name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "The Git Tag version to check out and publish (e.g., v1.0.0)"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Validate Tag Input
        run: |
          if [ -z "${{ inputs.tag }}" ]; then
            echo "Error: Tag name is required."
            exit 1
          fi

      - name: Checkout Code at Specific Tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Publish
        run: npm stage publish --provenance --access public
