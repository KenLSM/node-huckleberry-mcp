name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "The Git Tag version to check out and publish (e.g., v1.0.0)"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Validate Tag Input
        run: |
          if [ -z "${{ inputs.tag }}" ]; then
            echo "Error: Tag name is required."
            exit 1
          fi

      - name: Checkout Code at Specific Tag
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          package-manager-cache: false # never use caching in release builds

      # `npm stage publish` requires npm >= 11.15.0, newer than the npm bundled with
      # this workflow's Node. Remove this step once Node bundles npm >= 11.15.0 by default.
      - name: Pin npm with staged-publishing support
        run: npm install -g npm@11.15.0

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Publish
        run: npm stage publish --provenance --access public
